# Render Blueprint Specification for CHURNIQ
services:
  - type: web
    name: churniq-decision-engine
    env: python
    region: oregon
    plan: starter
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python src/train_pipeline.py"
    startCommand: "uvicorn api.main:app --host 0.0.0.0 --port $PORT --workers 2"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: churniq-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "https://churniq-frontend.vercel.app,http://localhost:3000"
      - key: API_SECRET_KEY
        generateValue: true
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: RATE_LIMIT_PREDICT
        value: "120/minute"
      - key: RATE_LIMIT_BATCH
        value: "20/minute"

databases:
  - name: churniq-db
    region: oregon
    plan: free
    databaseName: churniq_prod
    user: churniq_admin
