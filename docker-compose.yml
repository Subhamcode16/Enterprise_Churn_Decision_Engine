version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: valence-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: valence_db
      POSTGRES_USER: valence_user
      POSTGRES_PASSWORD: valence_secure_password_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U valence_user -d valence_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: valence-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql://valence_user:valence_secure_password_2026@db:5432/valence_db
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      API_SECRET_KEY: enterprise_valence_dev_key_2026
      WEBHOOK_SECRET: valence_secure_webhook_key_2026
    ports:
      - "8000:8000"
    volumes:
      - ./backend/logs:/app/logs
      - ./backend/models:/app/models

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: valence-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000
    ports:
      - "3000:3000"

volumes:
  postgres_data:
